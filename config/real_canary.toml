[project]
name = "RL + FSDP + Distillation (Real Canary)"
seed = 42

[token_rates_per_million]
prefill = 0.13
sample = 0.40
train = 0.40

[token_caps]
rl_prefill = 500000
rl_sample = 1500000
rl_train = 500000
fsdp_prefill = 400000
fsdp_sample = 1000000
fsdp_train = 500000
distill_prefill = 400000
distill_sample = 1200000
distill_train = 300000
eval_prefill = 250000
eval_sample = 800000
eval_train = 0

[models]
teacher = "meta-llama/Llama-3.1-8B"
student = "meta-llama/Llama-3.2-1B"
baseline = "meta-llama/Llama-3.2-1B"

[runtime]
default_mode = "mock"
projection_warning_min_usd = 5.0
projection_warning_max_usd = 12.0
real_required_env = ["TINKER_API_KEY", "TINKER_BASE_URL"]
real_poll_interval_seconds = 15
real_poll_timeout_seconds = 3600
retry_max_connections = 1000
retry_progress_timeout_seconds = 7200
retry_delay_base_seconds = 0.5
retry_delay_max_seconds = 10.0
retry_jitter_factor = 0.25
retry_enabled = true
max_consecutive_failures = 5

[evaluation]
prompt_file = "src/inference_projects/fixtures/real_eval_prompts_150.jsonl"
prompt_limit = 150
max_concurrency = 6
batch_size = 24
max_tokens_eval = 48
eval_temperature = 0.0
eval_stop_tokens = []
eval_max_tokens_candidates = [48, 96]
teacher_integrity_refusal_threshold = 0.30
teacher_integrity_min_score = 0.10
teacher_integrity_numeric_parse_threshold = 0.80

[distillation]
training_prompt_limit = 150
teacher_prompt_template = "raw"
filter_profile = "moderate"
hard_example_ratio = 0.4
kd_alpha = 0.5
kd_temperature = 2.0
learning_rate = 0.00002
epochs = 2
batch_size = 8
warmup_ratio = 0.1
lora_rank = 8
context_length = 4096
grad_clip = 1.0
weight_decay = 0.0

[campaign]
seeds = [17, 29, 43]
min_runs = 2
max_runs = 3
bootstrap_reps = 5000
early_stop_threshold = 0.03
strict_run_cap = 16

[tuning]
stage1_prompt_limit = 30
stage2_prompt_limit = 150
sweep_runs = 16
teacher_candidates = ["meta-llama/Llama-3.1-8B"]
promotion_top_k = 2
strict_run_cap = 16
